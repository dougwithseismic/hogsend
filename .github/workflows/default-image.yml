# Build, gate and publish the STOCK SCAFFOLD IMAGE that every freshly
# provisioned stack boots on.
#
# Callable two ways, deliberately:
#   workflow_call     — the Release workflow runs it after a successful publish
#   workflow_dispatch — a human runs it on demand
#
# The dispatch path is not a convenience. Until today this image had NEVER been
# published by CI: the job was skipped on almost every release (it is gated on
# `published == 'true'`) and failed the two times it actually ran, so every
# published tag — 0.57.0 through 0.64.0 — was pushed by hand from a laptop. A
# thing that only works when someone remembers to run a local command is a thing
# that silently stops happening, which is how the fleet ended up pointed at an
# image built before `@hogsend/plugin-hogsend` existed.
#
# One job, one definition, two triggers: the on-demand path CANNOT drift from
# the release path, because there is only one copy.
name: Default scaffold image

on:
  workflow_call:
  workflow_dispatch:

env:
  NODE_VERSION: "22"

jobs:
  publish:
    name: Build, preflight and push
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to GHCR
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The scaffold step prefers create-hogsend's dist and only falls back to
      # `pnpm exec tsx` — which pnpm refuses from the script's out-of-workspace
      # temp dir (ERR_PNPM_RECURSIVE_EXEC_NO_PACKAGE, the 0.63.0 failure).
      # Building dist here makes the preferred path the one that runs.
      - run: pnpm --filter create-hogsend build

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # Scaffold → docker build → preflight (all three run modes, under the env
      # a PROVISIONED stack actually runs: EMAIL_PROVIDER=hogsend plus the relay
      # vars) → push. The same pipeline a tenant publish uses; dev-mode env
      # defaults mean the script needs no secrets. Retries once after 5 minutes
      # because a freshly published version can lag on npm's anonymous read path.
      - name: Build, preflight and push
        env:
          CLOUD_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
        run: |
          pnpm --filter @hogsend/cloud build:default-image || {
            echo "first attempt failed — waiting 5m for npm read-path propagation, then retrying"
            sleep 300
            pnpm --filter @hogsend/cloud build:default-image
          }

      # Prove the tag provisioning will ASK FOR is actually pullable, the way
      # the substrate pulls it: anonymously, no credentials.
      #
      # This is the check whose absence caused the whole mess. A release bumps
      # `CLOUD_DEFAULT_ENGINE_VERSION` to the engine version and provisioning
      # then asks the substrate for `hogsend-default:<that version>` — but
      # nothing ever confirmed such a tag existed. The pin sat at 0.57.0 for
      # seven releases and no build was red about it. A successful `docker push`
      # above is not sufficient evidence either: it proves we wrote to the
      # registry, not that an unauthenticated puller can read it back.
      - name: Verify the tag is anonymously pullable
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/engine/package.json').version")
          REPO="${{ github.repository_owner }}/hogsend-default"
          echo "expecting ghcr.io/$REPO:$VERSION"
          TOKEN=$(curl -fsS "https://ghcr.io/token?scope=repository:$REPO:pull&service=ghcr.io" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).token")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$REPO/manifests/$VERSION")
          echo "manifest HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::hogsend-default:$VERSION is NOT anonymously pullable (HTTP $CODE). Provisioning sets this tag as the stock image, so every new stack would fail to pull it."
            exit 1
          fi
